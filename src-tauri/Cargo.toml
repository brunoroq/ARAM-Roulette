[package]
name = "aram-roulette"
version = "0.1.4"
description = "A deliberately stupid ARAM: Mayhem build randomizer."
license-file = "../LICENSE"
repository = "https://github.com/brunoroq/ARAM-Roulette"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
base64 = "0.22"
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
